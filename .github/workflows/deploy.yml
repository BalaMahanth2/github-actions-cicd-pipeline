name: Deploy to EC2


on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: deploy to EC2 
        uses: appleboy/ssh-action@v1.0.3
        with:
            host: ${{ secrets.EC2_HOST }}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              cd /home/ubuntu
              # remove old repo
              rm -rf github-actions-cicd-pipeline

              # clone new repo
              git clone https://github.com/BalaMahanth2/github-actions-cicd-pipeline.git

              # copy new code to web server directory 
              cp -r github-actions-cicd-pipeline/* /var/www/html/